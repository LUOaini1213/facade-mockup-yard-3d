name: Public viewer checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check published assets and dependencies
        run: python -B checks/validate_assets.py
      - name: Test HTTP service and asset rejection cases
        run: python -B -m unittest discover -s tests -p "test_*.py"
      - name: Test viewer lifecycle and interactions
        run: node --test tests/viewer-lifecycle.test.cjs
      - name: Verify published assets remain unchanged
        run: git diff --exit-code -- model renders textures vendor build
